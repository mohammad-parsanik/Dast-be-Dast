[project]
name = "dastbedast"
version = "0.1.0"
description = "Back office for an interest-free lending circle"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "django-simple-history>=3.7",
    "django-otp>=1.5",
    "qrcode>=7",
    "jdatetime>=5",
    "psycopg[binary]>=3.2",
    "gunicorn>=22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DJ"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]  # Persian text is intentional; Django class attrs

[tool.ruff.lint.per-file-ignores]
"src/dastbedast/fund/migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dastbedast.settings_test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/dastbedast/core"]
strict = true
ignore_missing_imports = true
