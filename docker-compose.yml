# Production-like stack. Copy .env.example to .env and fill it in first.
# The reminder scheduler will be added as a service in a later phase (PLAN §8).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py setup_roles &&
             gunicorn dastbedast.wsgi --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      - app
    command: python manage.py run_bot

volumes:
  pgdata:
